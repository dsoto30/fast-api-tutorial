services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DATABASE_HOSTNAME=postgres
    volumes:
      - ./:/usr/src/app:ro
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-bookworm
    environment:
      - POSTGRES_PASSWORD=strike30
      - POSTGRES_DB=fastapi

    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
